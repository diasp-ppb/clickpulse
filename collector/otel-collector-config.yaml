# ==============================================================================
# ClickPulse: OpenTelemetry Collector Reference Configuration
# Standardizes web analytics on OTLP Semantic Conventions for Events.
# Batches incoming OTLP/HTTP web events and writes to dedicated ClickHouse table.
# ==============================================================================

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Protect collector from OOM under traffic surges
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # CRITICAL: Buffer and batch writes to ClickHouse
  # Prevents single-row write degradation by flushing in atomic columnar blocks.
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Optional: Filter/Route ClickPulse events from general application logs
  # filter/clickpulse:
  #   logs:
  #     include:
  #       match_type: strict
  #       resource_attributes:
  #         - { key: "service.name", value: "clickpulse" }

exporters:
  # Dedicated ClickHouse exporter for ClickPulse web analytics events
  clickhouse/analytics:
    endpoint: "tcp://clickhouse:9000?database=clickpulse"
    database: "clickpulse"
    ttl: 13140h # 18 months
    logs_table_name: "analytics_events"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m

  # General SigNoz or backend logs exporter (if co-located with existing APM)
  # otlp/signoz:
  #   endpoint: "http://signoz-otel-collector:4317"
  #   tls:
  #     insecure: true

  # Debug logging for local verification
  debug:
    verbosity: basic

service:
  pipelines:
    # Dedicated pipeline for ClickPulse web analytics events
    logs/analytics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse/analytics, debug]

  telemetry:
    logs:
      level: info
