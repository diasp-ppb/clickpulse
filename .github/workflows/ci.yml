name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/**"
      - "tests/**"
      - "schema.sql"
      - "dashboards/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.mts"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "tests/**"
      - "schema.sql"
      - "dashboards/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.mts"
      - ".github/workflows/ci.yml"

# Automatically cancel obsolete workflow runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Test & Budget Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build Tracker Bundle
        run: npm run build

      - name: Verify Bundle Budget (< 1.5 KB gzipped)
        run: |
          SIZE=$(gzip -c public/tracker.min.js | wc -c | tr -d ' ')
          echo "Tracker min+gz size: ${SIZE} bytes"
          if [ "$SIZE" -gt 1536 ]; then
            echo "Error: Tracker bundle exceeds 1.5 KB limit (${SIZE}B > 1536B)"
            exit 1
          fi
