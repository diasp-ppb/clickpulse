name: Deploy Tracker to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "packages/tracker/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel obsolete in-progress runs on rapid pushes to save Actions runner minutes
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build tracker bundles
        run: npm run build

      - name: Verify tracker budget (< 1.5 KB gzipped)
        run: |
          SIZE=$(gzip -c public/tracker.min.js | wc -c | tr -d ' ')
          echo "Tracker min+gz size: ${SIZE} bytes"
          if [ "$SIZE" -gt 1536 ]; then
            echo "Error: Tracker bundle exceeds 1.5 KB limit (${SIZE}B > 1536B)"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
